{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dad Jokes</title>
    <link rel="stylesheet" href="{% static 'jokes/styles.css' %}">
</head>
<body>
    <main class="page">
        <h1>Dad Jokes</h1>

        {% if joke %}
            <p class="joke prompt">{{ joke.prompt }}</p>
            {% if joke.response %}
                <details class="punchline">
                    <summary>Show punchline</summary>
                    <p class="joke response">{{ joke.response }}</p>
                </details>
            {% endif %}
        {% else %}
            <p class="joke">No jokes are in the database yet.</p>
        {% endif %}

        <a class="button" href="{% url 'jokes:home' %}">Another joke</a>
    </main>

    <footer class="site-footer">
        <span>Fresh groans, one joke at a time 😊</span>
    </footer>
</body>
</html>
